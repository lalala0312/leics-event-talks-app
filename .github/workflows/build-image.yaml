name: Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - 'CD/d0/values-version.yaml'
      - 'CD/t0/values-version.yaml'
      - 'CD/p1/values-version.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed environment and version
        id: info
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED"

          ENV=""
          if echo "$CHANGED" | grep -q 'CD/d0'; then
            ENV=d0
          elif echo "$CHANGED" | grep -q 'CD/t0'; then
            ENV=t0
          elif echo "$CHANGED" | grep -q 'CD/p1'; then
            ENV=p1
          fi

          echo "Detected env: $ENV"
          echo "env=$ENV" >> $GITHUB_OUTPUT

          VERSION=$(grep 'version:' CD/${ENV}/values-version.yaml | awk '{print $2}' | tr -d '\r')
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leics-event-talks-app:${{ steps.info.outputs.version }}-${{ steps.info.outputs.env }}
